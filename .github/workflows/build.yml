# Builds the desktop bundles: AppImage on Linux, .msi + NSIS setup .exe (+ portable .exe)
# on Windows. Bundles can't be cross-compiled, so each comes from its own runner.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: its glibc (2.35) is older than Debian 12's (2.36), and
          # an AppImage only runs on systems with a glibc at least as new as the build host's.
          - os: ubuntu-22.04
            bundles: appimage
            artifacts: |
              target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            bundles: msi,nsis
            artifacts: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
              target/release/SteadyState.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libudev-dev libxdo-dev libssl-dev patchelf file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - name: Checks
        run: |
          npm run check
          cargo test -p steady_state_bench
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: SteadyState-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
